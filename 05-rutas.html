<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rutas en HTML</title>
</head>
<body>
    <h1>explicaicon: rutas y relativas</h1>

    <section>
        <h2>rutas absolutas</h2>
        <!-- ruta compleja a un recurso en un servidor externo. la ruta absoluta es la URL completa del recurso, esta no se modifica segun la ubicaicon del archivo actual -->
<p>
    para ir a un sitio externo como el catalogo global de repuestos, usamos la URL completa:
    <a href="https://www.shimano.com">visitar shimano internacional</a>
</p>
    <img src="https://www.manualweb.net/img/covers/html5-cover.jpg" alt="imagen HTML desde un servidor externo" width="300" height="200" title="HTML 5">
    </section>
    <hr>

    <section>
        <h2>rutas relativas</h2>
        <!-- ruta relativa a un recurso dentro del mismo proyecto. la ruta relativa se basa en la ubicación del archivo actual, y se ajusta segun la estructurade carpetas del proyecto -->
<p>
    ir a la pagina de <a href="04-inline-inblock.html">inline vs block</a>
    <!-- funciona si hay un archivo llamado 04-inline-inblock.html en la misma carpeta -->
</p>
<p>
    ver foto de tecnologia<a href="img/imagen_css.png">css 3</a>
    <!-- funciona si hay una imagen llamada imagen_css.png en la carpeta img -->
</p>
    </section>
</body>
</html>
