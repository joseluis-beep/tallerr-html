<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
<!--  los enlaces o anclas o hipervínculos  -->
<!-- a (anchor) significa "ancla". metafora: como en un barco te mantiene en una ubicacion especifica un ancla es justamente para que el usuario seá hacia donde buscar un recurso o hacia donde navegar en la pagina web -->
<!-- los atributos son caracteristicas que definen el comportamiento y la aparoencia de los elementos en este caso el atributo "href" vuelve funcional a la etiqueta es por rezones que se utiliza en el maquetado y no en el css dado que no es una caracteristica visula. -->
<!-- href (hyper reference) es la referencia a un recurso, es decir, el distino del enlace -->
<!-- lo que esta dentro de la etiqueta a es el texto visible que el usuario verá en la página web. mientras que lo que esat adentro de href es la referencia al recurso al que apunta eñ enlace-->
<h2 title=" titulo de la pagina">enlaces o anclas</h2>
<!-- por otra parte, el atributo title proporciona un texto de ayuda que se muestra cuando el usuario pasa el mouse sobre el enlace.las tecnologias de asistencia como lectores de pantalla utilizan este atributo para proporcionar información adicional al usuario. en el caso de personnas invidentes esto les permite acceder a la información adicional sobre el enlace -->
<a href="https://www.google.com" title="enlace a google">google</a>
<br>
<a href="https://www.facebook.com" title="enlace a facebook">facebook</a>
<br>
<a href="https://www.youtube.com" title="enlace a youtube">youtube</a>
<br>
<a title="ir al canal de youtube" href="https://www.youtube.com/feed/you">jose luis</a> <!--mala pracitca: usar protocolo relativo sin especificar el protocolo -->
<br>
<br>
<a href="03-1paginas-enlaces1.html">ir a enlace uno</a>
<br>
<a href="03-2paginas-enlaces2.html">ir a enlace dos</a>
<br>
<a href="03-3paginas-enlaces3.html">ir a enlace tres</a>
<!-- es sumamnete importante que en la programacion y el desarrollo web se utilicen las practiacs a medida que se va avanzando, de esta forma se asegura una mejor comprension y aplicacion de los conceptos. entiendan que la progremacion es un procesoactivo no pasivo, una cosa es intentar comprender lo que sucede cuando leen oo ven algo que se esta haciendo, sin embargo, la unica forma de aprender es probando ustedes mismostodo lo que se debe implimentar. -->
<br>
<h2>enlaces con target a otra ventana</h2>
<a href="03-4paginas-enlaces4.html" target="_blank">ir a enlace cuatro en nueva ventana</a>
<!-- el atributo target="_blank" abre el enlace en una nueva ventana o pestaña del navegador. por defecto siempre esta en _self que significa que se abre en la misma ventana -->
</body>
</html>
