<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes</title>
    <!-- https://techicons.dev/icons/react -->
</head>
<body>
    <!-- etiquetas de bloque y etiqueats de linea -->
    <h1>Imágenes</h1>
    <!-- las imágenes se insertan en htmlutilizando la etiqueta <img>. esta etiqueta es un elemento vacio, lo que significa que no tiene una etiqueta de cierre. la sintaxis para insertar una imagen es: -->
    <!-- vale la pena recordar que el atributo title prporciona un tooltip que se muestra caundo el usuario pasa el mouse sobre la imagen -->
    <img src="imagen.png" alt="Descripción de la imagen" title="Título de la imagen" width="200" height="200">
</body>
</html>
